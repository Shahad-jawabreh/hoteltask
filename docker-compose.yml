networks:
  db-network:
    driver: bridge

volumes:
  primary_data:
  secondary_data:
  secondary2_data:
  router_data:

services:
  # Primary MySQL Database
  mysql-primary:
    image: mysql:8.0
    container_name: mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hoteldb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3307:3306"  # Exposed for monitoring
    volumes:
      - primary_data:/var/lib/mysql
      - ./primary/my.cnf:/etc/mysql/conf.d/custom.cnf
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON

  # Secondary MySQL Database (Replica)
  mysql-secondary:
    image: mysql:8.0
    container_name: mysql-secondary
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hoteldb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3308:3306"  # Exposed for monitoring
    volumes:
      - secondary_data:/var/lib/mysql
      - ./secondary/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - db-network
    depends_on:
      - mysql-primary
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --read-only=1



  # MySQL Router for Automatic Failover
  mysql-router:
    image: mysql:8.0
    container_name: mysql-router
    ports:
      - "3306:3306"
      - "3309:3307"
    volumes:
      - ./mysql-router:/etc/mysqlrouter
    networks:
      - db-network
    depends_on:
      - mysql-primary
      - mysql-secondary
    restart: unless-stopped
    command: >
      sh -c "
      microdnf update -y &&
      microdnf install -y mysql-router &&
      mysqlrouter --config /etc/mysqlrouter/mysqlrouter.conf --user=mysqlrouter
      "

  mysql-watchdog:
    image: mysql:8.0
    container_name: mysql-watchdog
    volumes:
      - ./scripts/watchdog.sh:/usr/local/bin/watchdog.sh:ro
    entrypoint: ["/bin/bash","/usr/local/bin/watchdog.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - db-network
    restart: unless-stopped

  # Optional: Adminer for Database Management
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - db-network
    restart: unless-stopped
