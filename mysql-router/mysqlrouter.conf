[DEFAULT]
logging_folder = /var/log/mysqlrouter
runtime_folder = /var/run/mysqlrouter
data_folder = /var/lib/mysqlrouter
keyring_path = /var/lib/mysqlrouter/keyring
master_key_path = /var/lib/mysqlrouter/mysqlrouter.key
connect_timeout = 30
read_timeout = 30

[logger]
level = INFO

# Read-write connection (primary)
[routing:primary_rw]
bind_address = 0.0.0.0
bind_port = 3306
destinations = mysql-primary:3306,mysql-secondary:3306
routing_strategy = first-available
mode = read-write
connect_timeout = 3
max_connections = 1024

# Read-only connection (secondary)
[routing:secondary_ro]
bind_address = 0.0.0.0
bind_port = 3307
destinations = mysql-secondary:3306
routing_strategy = round-robin
mode = read-only
connect_timeout = 3
max_connections = 1024
